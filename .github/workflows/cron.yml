name: Scheduled jobs

# Runs Hey Lily's daily jobs against the live app. Free, in-repo, nothing
# external to manage. Add a repo secret CRON_SECRET (Settings → Secrets and
# variables → Actions) matching the CRON_SECRET set in Coolify, and it runs
# itself. Use "Run workflow" (workflow_dispatch) to test on demand.
on:
  schedule:
    - cron: "0 13 * * *" # daily at 13:00 UTC (~8–9am ET)
  workflow_dispatch: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Launchpad digest (paid but not live)
        run: |
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://admin.heylily.ai/api/cron/launchpad-digest)
          echo "HTTP $code"
          echo "Response: $(cat /tmp/body.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Digest failed with HTTP $code — check that CRON_SECRET matches in GitHub and Coolify."
            exit 1
          fi

      - name: Run compliance scans for accounts that are due
        run: |
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://admin.heylily.ai/api/cron/accessibility-scan)
          echo "HTTP $code"
          echo "Response: $(cat /tmp/body.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Scan trigger failed with HTTP $code."
            exit 1
          fi
